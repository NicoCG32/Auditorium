name: Calidad

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Verificar calidad
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Preparar npm
        run: npm install --global npm@12.2.0
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar verificaciones
        run: npm run check
      - name: Preparar navegadores
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Preparar salida de audio virtual
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          audio_runtime="${RUNNER_TEMP}/auditorium-audio-runtime"
          mkdir -p "$audio_runtime"
          chmod 700 "$audio_runtime"
          export XDG_RUNTIME_DIR="$audio_runtime"
          unset PULSE_SERVER
          pulseaudio --start --exit-idle-time=-1
          export PULSE_SERVER="unix:${audio_runtime}/pulse/native"
          pactl load-module module-null-sink sink_name=auditorium_test
          pactl set-default-sink auditorium_test
          pactl get-default-sink
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "PULSE_SERVER=$PULSE_SERVER" >> "$GITHUB_ENV"
      - name: Verificar reproducción de audio en Firefox
        run: npx playwright test e2e/local-audio.spec.ts --project=firefox --grep "alta con audio" --reporter=line
      - name: Verificar aceptación, accesibilidad y PWA
        run: npm run test:e2e
      - name: Conservar diagnóstico de navegador ante fallos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auditorium-browser-diagnostics-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Verificar prototipo aislado de proveedores sin red externa
        run: |
          node --test prototypes/media-01/media.test.mjs
          node prototypes/media-01/probe.mjs --mock --browser all
      - name: Verificar evaluación aislada de audio local
        run: |
          node --test prototypes/audio-01/audio.test.mjs
          node prototypes/audio-01/probe.mjs --browser all
      - name: Preparar paquete de entrega
        run: npm run package
      - name: Conservar paquete para revisión
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auditorium-package-${{ github.sha }}
          path: release/auditorium-*/
          if-no-files-found: error
          retention-days: 7
      - name: Cerrar salida de audio virtual
        if: always()
        run: |
          if pulseaudio --check; then
            pulseaudio --kill
          fi

  pages-build:
    name: Compilar web para Pages
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - name: Obtener la revisión validada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Preparar npm
        run: npm install --global npm@12.2.0
      - name: Instalar dependencias
        run: npm ci
      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Compilar para /Auditorium/
        run: npm run build:pages
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - name: Preparar sitio estático
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          retention-days: 1

  pages-deploy:
    name: Publicar web en Pages
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Publicar revisión validada
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
