name: Calidad

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Verificar calidad
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Preparar npm
        run: npm install --global npm@12.2.0
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar verificaciones
        run: npm run check
      - name: Preparar navegadores
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verificar aceptación, accesibilidad y PWA
        run: npm run test:e2e
      - name: Preparar paquete de entrega
        run: npm run package
      - name: Conservar paquete para revisión
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auditorium-package-${{ github.sha }}
          path: release/auditorium-*/
          if-no-files-found: error
          retention-days: 7
